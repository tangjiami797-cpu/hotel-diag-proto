  <title>住千度 · 抖音来客诊断 - 交互原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;

      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;

      font-weight: 600;
      color: #fff;
      background: #3b5bfd;
      margin-bottom: 14px;
    }
    .card.op .badge { background: #00b578; }
    .card b { display: block; font-size: 18px; margin-bottom: 8px; }
    .card p { font-size: 13px; color: #86909c; line-height: 1.7; }
    .foot { margin-top: 36px; font-size: 12px; color: #c9cdd4; }
